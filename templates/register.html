{% extends "base.html" %}
{% block title %}ลงทะเบียน - ระบบลงทะเบียนคอร์ส{% endblock %}

{% block content %}
<div class="form-container">
    <h2>แบบฟอร์มลงทะเบียนเรียน</h2>
    <form method="POST" action="{{ url_for('register') }}" novalidate>
        <div class="form-group">
            <label for="name">ชื่อ-นามสกุล <span class="required">*</span></label>
            <input type="text" id="name" name="name" placeholder="กรอกชื่อ-นามสกุล" required>
        </div>

        <div class="form-group">
            <label for="email">อีเมล <span class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
            <label for="phone">เบอร์โทรศัพท์</label>
            <input type="tel" id="phone" name="phone" placeholder="0XX-XXX-XXXX">
        </div>

        <div class="form-group">
            <label for="course_id">คอร์สที่ต้องการลงทะเบียน <span class="required">*</span></label>
            <select id="course_id" name="course_id" required>
                <option value="">-- เลือกคอร์ส --</option>
                {% for course in courses %}
                <option value="{{ course.id }}">{{ course.name }} (฿{{ "{:,}".format(course.price) }})</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary btn-full">ยืนยันการลงทะเบียน</button>
    </form>
</div>
{% endblock %}
