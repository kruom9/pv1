<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ระบบลงทะเบียนคอร์ส{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ url_for('index') }}" class="nav-brand">🎓 ศูนย์เรียนรู้</a>
            <div class="nav-links">
                <a href="{{ url_for('index') }}">หน้าแรก</a>
                <a href="{{ url_for('register') }}">ลงทะเบียน</a>
                <a href="{{ url_for('admin') }}">ผู้ดูแล</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>© 2026 ศูนย์เรียนรู้ · ระบบลงทะเบียนออนไลน์</p>
    </footer>
</body>
</html>
