const QN=10;
// สับตัวเลือกแบบกำหนดได้ (deterministic) ต่อ ผู้เล่น+คำถาม: ลำดับคงที่เมื่อรีโหลด แต่ต่างกันในแต่ละคน
function hash32(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h}
function mulberry32(a){return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function seededShuffle(arr,seed){const a=[...arr],rnd=mulberry32(hash32(seed));for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quiz(qs,id,title){let k=0,score=0;const boss=typeof id==='string';
 const show=()=>{const q=qs[k];const opts=seededShuffle(q[1].map((o,j)=>({o,ok:j===q[2]})),PID+'|'+SUBJ+'|'+q[0]);
  card.innerHTML=hdr(title,boss?'BOSS BATTLE':'แบบทดสอบ',boss?'background:linear-gradient(120deg,#b71c1c,#6a1b9a)':'')+`<div class="body"><div class="qp"><span>ข้อ ${k+1}/${qs.length}</span><span>✅ ${score}</span></div><div class="pbar" style="width:100%"><i style="width:${k/qs.length*100}%"></i></div><div class="q">${q[0]}</div><div class="opts">${opts.map((o,j)=>`<button class="btn opt" data-ok="${o.ok}">${'ABCD'[j]}. ${o.o}</button>`).join('')}</div></div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='true';if(ok)score++;
   card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.ok==='true')x.classList.add('ok')});if(!ok)b.classList.add('bad');
   setTimeout(()=>{k++;k<qs.length?show():result()},700)})};
 const result=()=>{const r=score/qs.length;const s=r>=.9?3:r>=.7?2:r>=.5?1:0;const coins=score*10*(boss?2:1)+s*5;api("result",{pid:PID,subj:SUBJ,base:String(id),score,total:qs.length,stars:s,coins:s?coins:0}).then(p=>{S=p;render()}).catch(e=>toast("⚠️ บันทึกคะแนนไม่สำเร็จ ตรวจสอบการเชื่อมต่อ"));
  if(s){if(s>stars(id))S.s[id]=s;S.coins+=coins;save();render();confetti()}
  card.innerHTML=hdr(title,'ผลการทดสอบ')+`<div class="body res"><div class="big">${st(s).replace('stars','stars" style="font-size:56px')}</div><h2>${s?'เยี่ยมมาก! ผ่านด่านแล้ว 🎉':'ยังไม่ผ่าน ลองอีกครั้งนะ 💪'}</h2><p>ตอบถูก ${score}/${qs.length} ข้อ ${s?`· ได้รับ 🪙 ${coins} เหรียญ`:'(ต้องถูกอย่างน้อย 50%)'}</p>${nextBtn(id,s)}<button class="btn go" style="background:#5c6bc0;box-shadow:0 4px 0 #303f9f;margin-top:8px" onclick="closeM()">🗺️ กลับไปที่แผนที่</button></div>`;
  const nb=card.querySelector('#nextb');if(nb)nb.onclick=()=>{const a=nb.dataset.a;if(a==='retry')boss?openBoss(BOSS.find(x=>x.id===id)):openLesson(id);else if(a[0]==='b')openBoss(BOSS.find(x=>x.id===a));else openLesson(+a)}};
 show()}
function nextBtn(id,s){if(!s)return '<button class="btn go" id="nextb" data-a="retry">🔁 ลองอีกครั้ง</button>';
 let a=null,lab='';if(typeof id==='number'){const b=BOSS.find(x=>Math.min(N,x.from+10)-1===id);if(b&&bossUnlocked(b)&&!stars(b.id)){a=b.id;lab='👹 ไปสู้บอส'}else if(id+1<N&&unlocked(id+1)){a=id+1;lab=`▶ ไปด่านที่ ${id+2}`}}
 else{const bi=BOSS.findIndex(x=>x.id===id);const n=BOSS[bi].from+10;if(n<N&&unlocked(n)){a=n;lab=`▶ ไปด่านที่ ${n+1}`}}
 return a===null?'<div style="margin:8px 0;font-weight:600">🏁 จบทุกด่านในวิชานี้แล้ว! ยอดเยี่ยมมาก</div>':`<button class="btn go" id="nextb" data-a="${a}">${lab}</button>`}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:70';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function confetti(){const c=document.getElementById('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const p=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height/2,v:2+Math.random()*4,s:5+Math.random()*6,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6}));let f=0;
 (function a(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.y+=q.v;q.r+=.1;x.fillStyle=q.c;x.save();x.translate(q.x+Math.sin(q.r)*10,q.y);x.rotate(q.r);x.fillRect(-q.s/2,-q.s/2,q.s,q.s*.6);x.restore()});if(++f<150)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
document.getElementById('reset').onclick=()=>{if(confirm('รีเซ็ตความคืบหน้าทั้งหมด?')){api('reset',{pid:PID,subj:SUBJ}).then(p=>{S=p;render()})}};
if(!PID)location.replace("index.html?need=1");else Promise.all([api("players"),api("progress",{pid:PID,subj:SUBJ})]).then(([pl,p])=>{ME=pl.players.find(x=>x.id===PID);if(!ME){localStorage.removeItem("piyamit_pid");location.replace("index.html?need=1");return}S=p;render();document.querySelector("header").insertAdjacentHTML("beforeend",`<a class="stat" href="index.html" style="text-decoration:none" title="เปลี่ยนผู้เล่น">👤 ${ME.nick||ME.name} · ${ME.cls||""}</a>`)}).catch(e=>{document.body.insertAdjacentHTML("afterbegin","<div style=\"background:#c62828;color:#fff;padding:10px;text-align:center\">⚠️ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ลองรีเฟรชหน้า</div>")});
</script></body></html>
