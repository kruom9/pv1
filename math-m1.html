const map=document.getElementById('map');
function render(){
 map.querySelectorAll('.node,.zone,.deco,svg').forEach(e=>e.remove());
 const pts=[...P.slice(0,5),[50,63],...P.slice(5,10).reverse()];
 const pts2=N<=10?[]:[...P.slice(10,15),[96,63],...P.slice(15,20).reverse()];
 const path=a=>a.map((p,i)=>(i?'L':'M')+p[0]*10+' '+p[1]*5).join(' ');
 map.insertAdjacentHTML('beforeend',`<svg class="path" viewBox="0 0 1000 500" preserveAspectRatio="none">
 ${[pts,pts2].filter(a=>a.length).map(a=>`<path d="${path(a)}" fill="none" stroke="#f3d9a4" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/><path d="${path(a)}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="10 10"/>`).join('')}
 <path d="M${P[4][0]*10} ${P[4][1]*5} L480 85" stroke="#e57373" stroke-width="6" stroke-dasharray="6 8" fill="none"/>
 ${N>10?`<path d="M${P[14][0]*10} ${P[14][1]*5} L930 85" stroke="#e57373" stroke-width="6" stroke-dasharray="6 8" fill="none"/>`:''}</svg>`);
 const deco=[["🏰",2,12],["🎡",30,14],["🚌",22,62],["🌳",12,63],["🌴",40,64],["🏯",10,20],["🌉",30,58],["⛵",20,58],["✈️",60,15],["🏙️",68,16],["🗽",80,18],["🌋",52,8],["🌴",86,62],["🏝️",70,62],["🐘",3,62],["🌸",50,94],["🏟️",98,60]];
 deco.forEach(d=>map.insertAdjacentHTML('beforeend',`<div class="deco" style="left:${d[1]}%;top:${d[2]}%">${d[0]}</div>`));
 map.insertAdjacentHTML('beforeend',CFG.zones||`<div class="zone" style="left:8%;background:#1e5bb8">ช่วงที่ 1 : ก่อนสอบกลางภาค (ด่านที่ 1-10)<small>ทบทวนพื้นฐานและการสื่อสารในชีวิตประจำวัน</small></div>
 <div class="zone" style="left:56%;background:#8e24aa">ช่วงที่ 2 : หลังสอบกลางภาค (ด่านที่ 11-20)<small>ไวยากรณ์ การอ่าน การเขียน และการสื่อสารในสถานการณ์ต่าง ๆ</small></div>`);
 L.forEach((l,i)=>{const c=stars(i)?'done':unlocked(i)?'open':'locked';
  map.insertAdjacentHTML('beforeend',`<div class="node ${c}" data-i="${i}" style="left:${P[i][0]}%;top:${P[i][1]}%"><div class="c">${c==='locked'?'🔒':i+1}</div>${st(stars(i))}<div class="lb">${l.e} ${l.t}<small>${l.th}</small></div></div>`)});
 BOSS.forEach(b=>{const c=stars(b.id)?'done':bossUnlocked(b)?'open':'locked';
  map.insertAdjacentHTML('beforeend',`<div class="node boss ${c}" data-b="${b.id}" style="left:${b.pos[0]}%;top:${b.pos[1]}%"><div class="c">${c==='locked'?'🔒':'👹'}</div>${st(stars(b.id))}<div class="lb">${b.t}<small>${b.th}</small></div></div>`)});
 // header
 const done=L.filter((_,i)=>stars(i)).length;let tot=0;L.forEach((_,i)=>tot+=stars(i));
 const pc=Math.round(done/N*100);pb.style.width=pc+'%';pt.textContent=`${done}/${N} ด่าน (${pc}%)`;document.getElementById('st').textContent=tot+'/'+N*3;co.textContent=S.coins;
 // table
 const cur=L.findIndex((_,i)=>!stars(i)&&unlocked(i));
 const row=i=>{const s=stars(i);const b=s?'<span class="badge b-done">ผ่านแล้ว</span>':i===cur?'<span class="badge b-cur">กำลังเรียน</span>':'<span class="badge b-no">ยังไม่เริ่ม</span>';
  return `<div class="row" data-i="${i}"><b>${i+1}</b><span style="font-size:20px">${L[i].e}</span><div class="t">${L[i].t}<small>${L[i].th}</small><small class="desc">📌 ${L[i].g}</small><small class="desc2">📚 ${L[i].w.join(" · ")}</small></div>${b}${st(s)}</div>`};
 const rng=(a,b)=>{let h='';for(let i=a;i<b;i++)h+=row(i);return h};
 document.getElementById('table').innerHTML=CFG.units?CFG.units(rng):`<div class="unit" style="border-color:#1e88e5"><h3>📘 หน่วยที่ 1 ทบทวนพื้นฐานและการสื่อสารในชีวิตประจำวัน (ด่านที่ 1-5)</h3>${rng(0,5)}</div>
 <div class="unit" style="border-color:#43a047"><h3>📗 หน่วยที่ 2 การใช้ภาษาในสถานการณ์ต่าง ๆ (ด่านที่ 6-10)</h3>${rng(5,10)}</div>
 <div class="unit" style="border-color:#8e24aa"><h3>📕 หน่วยที่ 3 ไวยากรณ์ การอ่าน การเขียน และสังคมโลก (ด่านที่ 11-20)</h3><div class="u3"><div>${rng(10,15)}</div><div>${rng(15,20)}</div></div></div>`;
}
document.addEventListener('click',e=>{const n=e.target.closest('[data-i],[data-b]');if(!n||n.closest('#modal'))return;
 if(n.dataset.b){const b=BOSS.find(x=>x.id===n.dataset.b);if(bossUnlocked(b))openBoss(b);else toast('🔒 ต้องผ่านด่านทั้ง 10 ด่านในช่วงนี้ก่อน');return}
 const i=+n.dataset.i;if(i>=N)return;if(unlocked(i))openLesson(i);else toast('🔒 ต้องผ่านด่านก่อนหน้าก่อนนะ')});
const modal=document.getElementById('modal'),card=document.getElementById('card');
function closeM(){modal.classList.remove('show')}
modal.addEventListener('click',e=>{if(e.target===modal)closeM()});
function hdr(t,s,c){return `<div class="top" style="${c||''}"><button class="btn x" onclick="closeM()">✕</button><h2>${t}</h2><div>${s}</div></div>`}
function openLesson(i){const l=L[i];
 card.innerHTML=hdr(`${l.e} ด่านที่ ${i+1}: ${l.t}`,l.th)+`<div class="body">
 <div class="box g1"><h4>🎯 เป้าหมายการเรียนรู้</h4><ul><li>${l.g}</li></ul></div>
 <div class="box g2"><h4>📚 สิ่งที่จะได้เรียนรู้</h4><ul>${l.w.map(x=>`<li>${x}</li>`).join('')}</ul></div>
 <div class="box g3"><h4>🔤 คำศัพท์สำคัญ</h4><div class="vocab">${l.v.map(x=>`<span>${x}</span>`).join('')}</div></div>
 <button class="btn go" id="start">🎮 เริ่มทำแบบทดสอบ (${Math.min(QN,l.q.length)} ข้อ จากคลัง ${l.q.length} ข้อ)</button></div>`;
 modal.classList.add('show');start.onclick=()=>quiz(shuffle(l.q).slice(0,QN),i,`ด่านที่ ${i+1}: ${l.t}`)}
function openBoss(b){const pool=[];for(let i=b.from;i<Math.min(N,b.from+10);i++)if(L[i])pool.push(L[i].q[Math.floor(Math.random()*L[i].q.length)]);
 card.innerHTML=hdr(`👹 ${b.t}: ${b.th}`,'ตอบคำถามผสมจากทุกด่าน 10 ข้อ เพื่อพิชิตบอส!','background:linear-gradient(120deg,#b71c1c,#6a1b9a)')+`<div class="body"><div class="box g3"><h4>⚔️ กติกา</h4><ul><li>${pool.length} ข้อ จากด่าน ${b.from+1}-${b.from+pool.length}</li><li>ถูก 5 ข้อขึ้นไปเพื่อผ่าน</li><li>รางวัลเหรียญ x2</li></ul></div><button class="btn go" id="start">⚔️ ท้าสู้บอส!</button></div>`;
 modal.classList.add('show');start.onclick=()=>quiz(shuffle(pool),b.id,`${b.t} – ${b.th}`)}
const QN=10;
// สับตัวเลือกแบบกำหนดได้ (deterministic) ต่อ ผู้เล่น+คำถาม: ลำดับคงที่เมื่อรีโหลด แต่ต่างกันในแต่ละคน
function hash32(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h}
function mulberry32(a){return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function seededShuffle(arr,seed){const a=[...arr],rnd=mulberry32(hash32(seed));for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quiz(qs,id,title){let k=0,score=0;const boss=typeof id==='string';
 const show=()=>{const q=qs[k];const opts=seededShuffle(q[1].map((o,j)=>({o,ok:j===q[2]})),PID+'|'+SUBJ+'|'+q[0]);
  card.innerHTML=hdr(title,boss?'BOSS BATTLE':'แบบทดสอบ',boss?'background:linear-gradient(120deg,#b71c1c,#6a1b9a)':'')+`<div class="body"><div class="qp"><span>ข้อ ${k+1}/${qs.length}</span><span>✅ ${score}</span></div><div class="pbar" style="width:100%"><i style="width:${k/qs.length*100}%"></i></div><div class="q">${q[0]}</div><div class="opts">${opts.map((o,j)=>`<button class="btn opt" data-ok="${o.ok}">${'ABCD'[j]}. ${o.o}</button>`).join('')}</div></div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.ok==='true';if(ok)score++;
   card.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.ok==='true')x.classList.add('ok')});if(!ok)b.classList.add('bad');
   setTimeout(()=>{k++;k<qs.length?show():result()},700)})};
 const result=()=>{const r=score/qs.length;const s=r>=.9?3:r>=.7?2:r>=.5?1:0;const coins=score*10*(boss?2:1)+s*5;api("result",{pid:PID,subj:SUBJ,base:String(id),score,total:qs.length,stars:s,coins:s?coins:0}).then(p=>{S=p;render()}).catch(e=>toast("⚠️ บันทึกคะแนนไม่สำเร็จ ตรวจสอบการเชื่อมต่อ"));
  if(s){if(s>stars(id))S.s[id]=s;S.coins+=coins;save();render();confetti()}
  card.innerHTML=hdr(title,'ผลการทดสอบ')+`<div class="body res"><div class="big">${st(s).replace('stars','stars" style="font-size:56px')}</div><h2>${s?'เยี่ยมมาก! ผ่านด่านแล้ว 🎉':'ยังไม่ผ่าน ลองอีกครั้งนะ 💪'}</h2><p>ตอบถูก ${score}/${qs.length} ข้อ ${s?`· ได้รับ 🪙 ${coins} เหรียญ`:'(ต้องถูกอย่างน้อย 50%)'}</p>${nextBtn(id,s)}<button class="btn go" style="background:#5c6bc0;box-shadow:0 4px 0 #303f9f;margin-top:8px" onclick="closeM()">🗺️ กลับไปที่แผนที่</button></div>`;
  const nb=card.querySelector('#nextb');if(nb)nb.onclick=()=>{const a=nb.dataset.a;if(a==='retry')boss?openBoss(BOSS.find(x=>x.id===id)):openLesson(id);else if(a[0]==='b')openBoss(BOSS.find(x=>x.id===a));else openLesson(+a)}};
 show()}
function nextBtn(id,s){if(!s)return '<button class="btn go" id="nextb" data-a="retry">🔁 ลองอีกครั้ง</button>';
 let a=null,lab='';if(typeof id==='number'){const b=BOSS.find(x=>Math.min(N,x.from+10)-1===id);if(b&&bossUnlocked(b)&&!stars(b.id)){a=b.id;lab='👹 ไปสู้บอส'}else if(id+1<N&&unlocked(id+1)){a=id+1;lab=`▶ ไปด่านที่ ${id+2}`}}
 else{const bi=BOSS.findIndex(x=>x.id===id);const n=BOSS[bi].from+10;if(n<N&&unlocked(n)){a=n;lab=`▶ ไปด่านที่ ${n+1}`}}
 return a===null?'<div style="margin:8px 0;font-weight:600">🏁 จบทุกด่านในวิชานี้แล้ว! ยอดเยี่ยมมาก</div>':`<button class="btn go" id="nextb" data-a="${a}">${lab}</button>`}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:70';document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function confetti(){const c=document.getElementById('confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const p=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height/2,v:2+Math.random()*4,s:5+Math.random()*6,c:`hsl(${Math.random()*360},90%,60%)`,r:Math.random()*6}));let f=0;
 (function a(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.y+=q.v;q.r+=.1;x.fillStyle=q.c;x.save();x.translate(q.x+Math.sin(q.r)*10,q.y);x.rotate(q.r);x.fillRect(-q.s/2,-q.s/2,q.s,q.s*.6);x.restore()});if(++f<150)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
document.getElementById('reset').onclick=()=>{if(confirm('รีเซ็ตความคืบหน้าทั้งหมด?')){api('reset',{pid:PID,subj:SUBJ}).then(p=>{S=p;render()})}};
if(!PID)location.replace("index.html?need=1");else Promise.all([api("players"),api("progress",{pid:PID,subj:SUBJ})]).then(([pl,p])=>{ME=pl.players.find(x=>x.id===PID);if(!ME){localStorage.removeItem("piyamit_pid");location.replace("index.html?need=1");return}S=p;render();document.querySelector("header").insertAdjacentHTML("beforeend",`<a class="stat" href="index.html" style="text-decoration:none" title="เปลี่ยนผู้เล่น">👤 ${ME.nick||ME.name} · ${ME.cls||""}</a>`)}).catch(e=>{document.body.insertAdjacentHTML("afterbegin","<div style=\"background:#c62828;color:#fff;padding:10px;text-align:center\">⚠️ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ลองรีเฟรชหน้า</div>")});
</script></body></html>
